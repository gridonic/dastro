pre-commit:
  parallel: true
  jobs:
    - name: astro check
      run: npx astro check --minimumFailingSeverity hint
    - name: eslint
      glob:
        - 'src/*.{js,mjs,ts,jsx,tsx,astro}'
        - 'src/**/*.{js,mjs,ts,jsx,tsx,astro}'
      run: npx eslint --no-warn-ignored {staged_files}
    - name: stylelint
      glob:
        - 'src/*.{css,scss,astro}'
        - 'src/**/*.{css,scss,astro}'
      run: npx stylelint --allow-empty-input {staged_files}
    - name: test
      run: npm run test --if-present

post-merge:
  jobs:
    - name: npm install if needed
      run: |
        HASHFILE="$(git rev-parse --git-path .last_package_lock_hash)"
        CURRENT_HASH="$(cat "$HASHFILE" 2>/dev/null)"
        NEW_HASH=$(sha256sum package-lock.json 2>/dev/null)
        if [ "$NEW_HASH" != "$CURRENT_HASH" ]; then
          echo "🔧 package-lock.json changed, running npm ci..."
          npm ci && echo "$NEW_HASH" > "$HASHFILE"
        fi

